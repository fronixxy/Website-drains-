<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Mainline backwater valve installed in basement floor">
<defs>
<pattern id="soil" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#7a5a3c"/><circle cx="8" cy="10" r="2" fill="#6a4c31"/><circle cx="28" cy="22" r="1.6" fill="#8d6b4a"/><circle cx="18" cy="34" r="2.2" fill="#654729"/><circle cx="34" cy="6" r="1.2" fill="#916f4d"/></pattern>
<pattern id="gravel" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#9c9a94"/><circle cx="5" cy="6" r="4" fill="#bdbab3"/><circle cx="16" cy="5" r="3.4" fill="#86837c"/><circle cx="11" cy="16" r="4.2" fill="#aeaba4"/><circle cx="21" cy="18" r="3" fill="#c9c6bf"/><circle cx="2" cy="20" r="2.6" fill="#7d7a73"/></pattern>
<pattern id="concrete" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#c4c2bc"/><circle cx="7" cy="9" r="1" fill="#a9a7a1"/><circle cx="22" cy="20" r="1.2" fill="#b3b1ab"/><circle cx="15" cy="27" r=".8" fill="#9e9c96"/></pattern>
<pattern id="dimple" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#1f2a36"/><circle cx="7" cy="7" r="4" fill="#2e3e50"/></pattern>
<pattern id="grass" width="12" height="14" patternUnits="userSpaceOnUse"><rect width="12" height="14" fill="#5e9c45"/><path d="M2 14 L4 4 L6 14 M7 14 L9 2 L11 14" fill="#4c8636"/></pattern>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd9f0"/><stop offset="1" stop-color="#e9f3fb"/></linearGradient>
<linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f2"/><stop offset=".6" stop-color="#d9d8d3"/><stop offset="1" stop-color="#b4b3ad"/></linearGradient>
<linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f55"/><stop offset="1" stop-color="#1f2328"/></linearGradient>
</defs>
<rect width="800" height="560" fill="url(#soil)"/>
<rect x="0" y="0" width="800" height="150" fill="#e9e4dc"/>
<rect x="0" y="150" width="800" height="40" fill="url(#concrete)"/>
<rect x="260" y="150" width="280" height="40" fill="#bdb9b1"/>
<rect x="270" y="130" width="260" height="24" rx="4" fill="#2d6a3e"/><text x="400" y="147" font-family="Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">BACKWATER VALVE ACCESS</text>
<rect x="290" y="190" width="220" height="200" fill="#1d1f22" opacity=".85"/>
<rect x="0" y="330" width="290" height="50" fill="url(#pipe)"/><rect x="510" y="330" width="290" height="50" fill="url(#pipe)"/>
<rect x="290" y="300" width="220" height="110" rx="14" fill="#262a2f"/>
<rect x="305" y="315" width="190" height="80" rx="10" fill="#3a4047"/>
<path d="M400 320 L400 392 L430 392 Z" fill="#e2a514"/>
<circle cx="400" cy="322" r="6" fill="#ccc"/>
<g fill="#3b8fd9"><path d="M60 355 l30 -12 v8 h40 v8 h-40 v8z" transform="rotate(180 95 355)"/><path d="M560 355 l30 -12 v8 h40 v8 h-40 v8z" transform="rotate(180 595 355)"/></g>
<text x="640" y="420" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#fff">to city sewer</text>
<text x="30" y="420" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#fff">from house</text>
<g font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600"><rect x="260" y="460" rx="6" width="320" height="30" fill="#0f2a44" opacity=".88"/><text x="270" y="481" fill="#fff">Flap closes when sewer backs up</text></g>
</svg>
